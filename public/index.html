<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>FFVN.TGM — VIDEO 4K</title>

<style>
@font-face{
  font-family:GFF-LATIN-BOLD;
  src:url("/fonts/GFFLatinW05-Bold.woff2") format("woff2");
  font-weight:700;
  font-display:swap;
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  min-height:100vh;
  background:
    radial-gradient(circle at 20% 10%,rgba(255,100,0,.18),transparent 30%),
    radial-gradient(circle at 85% 90%,rgba(255,50,0,.13),transparent 35%),
    #050505;
  color:#fff;
  font-family:GFF-LATIN-BOLD,Arial,sans-serif;
}

.container{
  width:calc(100% - 20px);
  max-width:720px;
  margin:auto;
  padding:25px 0 45px;
}

.logo{
  display:block;
  width:76px;
  height:76px;
  object-fit:cover;
  border-radius:22px;
  margin:0 auto 15px;
  box-shadow:0 0 35px rgba(255,80,0,.3);
}

.title{
  text-align:center;
  font-size:clamp(30px,9vw,48px);
  background:linear-gradient(135deg,#fff,#ff9700,#ff3d00);
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
}

.sub{
  text-align:center;
  margin-top:7px;
  color:#777;
  font-size:11px;
}

.card{
  margin-top:25px;
  padding:15px;
  border-radius:25px;
  background:rgba(255,255,255,.045);
  border:1px solid rgba(255,255,255,.08);
  backdrop-filter:blur(20px);
}

/* =========================
   CHỌN VIDEO
========================= */

.select-box{
  width:100%;
  min-height:220px;
  border:1px dashed rgba(255,110,0,.55);
  border-radius:20px;
  background:rgba(255,90,0,.025);
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  transition:.2s;
}

.select-box.drag{
  border-color:#ff7300;
  background:rgba(255,90,0,.1);
}

.select-content{
  padding:25px;
}

.icon{
  width:65px;
  height:65px;
  margin:auto;
  display:grid;
  place-items:center;
  border-radius:20px;
  background:linear-gradient(135deg,#ff8a00,#ff3d00);
  font-size:28px;
  box-shadow:0 12px 35px rgba(255,70,0,.25);
}

.select-title{
  margin-top:15px;
  font-size:20px;
}

.select-desc{
  margin-top:7px;
  color:#777;
  font-family:Arial,sans-serif;
  font-size:12px;
}

/* INPUT THẬT */
#videoInput{
  position:absolute;
  width:1px;
  height:1px;
  opacity:0;
  pointer-events:none;
}

/* NÚT THẬT */
.choose-btn{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  min-width:190px;
  margin-top:17px;
  padding:14px 22px;
  border:0;
  border-radius:14px;
  background:linear-gradient(135deg,#ff8a00,#ff3d00);
  color:#fff;
  cursor:pointer;
  font-family:GFF-LATIN-BOLD,Arial,sans-serif;
  font-size:14px;
  -webkit-tap-highlight-color:transparent;
}

/* =========================
   PREVIEW
========================= */

.preview{
  display:none;
  position:relative;
  overflow:hidden;
  border-radius:18px;
  background:#000;
}

.preview video{
  width:100%;
  max-height:420px;
  display:block;
  object-fit:contain;
  background:#000;
}

.change-btn{
  position:absolute;
  top:10px;
  right:10px;
  z-index:5;
  border:0;
  padding:9px 12px;
  border-radius:10px;
  background:rgba(0,0,0,.75);
  color:#fff;
  font-family:GFF-LATIN-BOLD,Arial,sans-serif;
  cursor:pointer;
}

/* =========================
   FILE
========================= */

.file-name{
  display:none;
  margin-top:12px;
  padding:12px;
  border-radius:13px;
  background:rgba(255,255,255,.04);
  color:#aaa;
  text-align:center;
  font-family:Arial,sans-serif;
  font-size:12px;
  word-break:break-word;
}

/* =========================
   THÔNG TIN VIDEO
========================= */

.video-info{
  display:none;
  grid-template-columns:1fr 1fr;
  gap:9px;
  margin-top:12px;
}

.info{
  padding:13px;
  border-radius:14px;
  background:rgba(255,255,255,.04);
  border:1px solid rgba(255,255,255,.06);
}

.info-label{
  display:block;
  color:#666;
  font-size:9px;
  margin-bottom:6px;
}

.info-value{
  display:block;
  color:#fff;
  font-size:13px;
  word-break:break-word;
}

/* =========================
   API
========================= */

.field{
  margin-top:14px;
  padding:14px;
  border-radius:15px;
  background:rgba(255,255,255,.04);
  border:1px solid rgba(255,255,255,.06);
}

.field label{
  display:block;
  margin-bottom:7px;
  color:#666;
  font-size:9px;
}

.field input{
  width:100%;
  border:0;
  outline:0;
  background:transparent;
  color:#fff;
  font-family:Arial,sans-serif;
  font-size:14px;
}

/* =========================
   BUTTON
========================= */

.process-btn{
  width:100%;
  margin-top:15px;
  padding:17px;
  border:0;
  border-radius:16px;
  background:linear-gradient(135deg,#ff8a00,#ff3d00);
  color:#fff;
  font-family:GFF-LATIN-BOLD,Arial,sans-serif;
  font-size:15px;
  cursor:pointer;
  transition:.2s;
}

.process-btn:disabled{
  opacity:.4;
  cursor:not-allowed;
}

.process-btn:not(:disabled):active{
  transform:scale(.98);
}

/* =========================
   PROGRESS
========================= */

.progress-box{
  display:none;
  margin-top:18px;
}

.progress-head{
  display:flex;
  justify-content:space-between;
  color:#aaa;
  font-size:11px;
  margin-bottom:8px;
}

.progress{
  height:9px;
  overflow:hidden;
  border-radius:99px;
  background:#181818;
}

.progress-bar{
  width:0;
  height:100%;
  background:linear-gradient(90deg,#ff4500,#ffae00);
  border-radius:99px;
  transition:width .3s;
}

.status{
  margin-top:10px;
  padding:12px;
  border-radius:13px;
  text-align:center;
  color:#888;
  background:rgba(255,255,255,.04);
  font-family:Arial,sans-serif;
  font-size:12px;
}

/* =========================
   RESULT
========================= */

.result{
  display:none;
  margin-top:15px;
}

.download{
  display:block;
  padding:16px;
  border-radius:15px;
  text-align:center;
  text-decoration:none;
  color:#fff;
  background:#151515;
  border:1px solid rgba(255,255,255,.08);
}

.footer{
  margin-top:23px;
  text-align:center;
  color:#444;
  font-size:10px;
}

@media(max-width:500px){
  .card{
    padding:12px;
  }

  .select-box{
    min-height:230px;
  }
}
</style>
</head>

<body>

<div class="container">

  <img
    class="logo"
    src="https://cdn.imagetourls.com/uploads/tyImg/1ggIdgxtr.jpg"
    alt="FFVN.TGM"
  >

  <h1 class="title">FFVN.TGM</h1>

  <div class="sub">
    VIDEO ENHANCER • AUTO FRAME • 4K
  </div>

  <div class="card">

    <!-- KHU VỰC CHỌN VIDEO -->
    <div
      class="select-box"
      id="selectBox"
    >

      <div class="select-content">

        <div class="icon">🎬</div>

        <div class="select-title">
          CHÈN VIDEO
        </div>

        <div class="select-desc">
          Tự động nhận dạng khung hình video
        </div>

        <button
          type="button"
          class="choose-btn"
          id="chooseBtn"
        >
          + CHỌN VIDEO
        </button>

      </div>

    </div>

    <!-- INPUT -->
    <input
      id="videoInput"
      type="file"
      accept="video/*,.mp4,.mov,.mkv,.webm,.avi,.m4v"
    >

    <!-- PREVIEW -->
    <div
      class="preview"
      id="preview"
    >

      <video
        id="videoPreview"
        controls
        playsinline
        preload="metadata"
      ></video>

      <button
        type="button"
        class="change-btn"
        id="changeBtn"
      >
        ĐỔI VIDEO
      </button>

    </div>

    <!-- TÊN FILE -->
    <div
      class="file-name"
      id="fileName"
    ></div>

    <!-- THÔNG TIN -->
    <div
      class="video-info"
      id="videoInfo"
    >

      <div class="info">
        <span class="info-label">
          ĐỘ PHÂN GIẢI
        </span>

        <span
          class="info-value"
          id="resolution"
        >
          —
        </span>
      </div>

      <div class="info">
        <span class="info-label">
          KHUNG HÌNH
        </span>

        <span
          class="info-value"
          id="aspect"
        >
          —
        </span>
      </div>

      <div class="info">
        <span class="info-label">
          THỜI LƯỢNG
        </span>

        <span
          class="info-value"
          id="duration"
        >
          —
        </span>
      </div>

      <div class="info">
        <span class="info-label">
          DUNG LƯỢNG
        </span>

        <span
          class="info-value"
          id="size"
        >
          —
        </span>
      </div>

    </div>

    <!-- API KEY -->
    <div class="field">

      <label>PRIVATE API KEY</label>

      <input
        id="apiKey"
        type="password"
        placeholder="Nhập API Key"
        autocomplete="off"
      >

    </div>

    <!-- XỬ LÝ -->
    <button
      type="button"
      class="process-btn"
      id="processBtn"
      disabled
    >
      ✦ CHỈNH VIDEO SẮC NÉT 4K
    </button>

    <!-- PROGRESS -->
    <div
      class="progress-box"
      id="progressBox"
    >

      <div class="progress-head">

        <span id="progressText">
          Đang xử lý...
        </span>

        <span id="progressPercent">
          0%
        </span>

      </div>

      <div class="progress">

        <div
          class="progress-bar"
          id="progressBar"
        ></div>

      </div>

      <div
        class="status"
        id="status"
      >
        Đang chuẩn bị...
      </div>

    </div>

    <!-- KẾT QUẢ -->
    <div
      class="result"
      id="result"
    >

      <a
        class="download"
        id="downloadBtn"
        href="#"
      >
        ↓ TẢI VIDEO 4K
      </a>

    </div>

  </div>

  <div class="footer">
    FFVN.TGM • PRIVATE VIDEO API
  </div>

</div>

<script>

const $ = id =>
  document.getElementById(id);

const videoInput =
  $("videoInput");

const chooseBtn =
  $("chooseBtn");

const changeBtn =
  $("changeBtn");

const selectBox =
  $("selectBox");

const preview =
  $("preview");

const videoPreview =
  $("videoPreview");

const fileName =
  $("fileName");

const videoInfo =
  $("videoInfo");

const resolution =
  $("resolution");

const aspect =
  $("aspect");

const duration =
  $("duration");

const size =
  $("size");

const apiKey =
  $("apiKey");

const processBtn =
  $("processBtn");

const progressBox =
  $("progressBox");

const progressBar =
  $("progressBar");

const progressText =
  $("progressText");

const progressPercent =
  $("progressPercent");

const status =
  $("status");

const result =
  $("result");

const downloadBtn =
  $("downloadBtn");

let selectedFile = null;
let previewURL = null;
let jobId = null;
let polling = null;


/* ==========================
   CHỌN VIDEO
========================== */

chooseBtn.addEventListener("click", function(e){

  e.preventDefault();
  e.stopPropagation();

  videoInput.click();

});


/* ==========================
   ĐỔI VIDEO
========================== */

changeBtn.addEventListener("click", function(e){

  e.preventDefault();
  e.stopPropagation();

  videoInput.value = "";

  videoInput.click();

});


/* ==========================
   INPUT VIDEO
========================== */

videoInput.addEventListener("change", function(){

  const file = this.files && this.files[0];

  if(!file) return;

  loadVideo(file);

});


/* ==========================
   LOAD VIDEO
========================== */

function loadVideo(file){

  if(!isVideo(file)){

    alert("File bạn chọn không phải video.");

    videoInput.value = "";

    return;
  }

  selectedFile = file;

  if(previewURL){
    URL.revokeObjectURL(previewURL);
  }

  previewURL =
    URL.createObjectURL(file);

  videoPreview.src =
    previewURL;

  videoPreview.load();

  selectBox.style.display =
    "none";

  preview.style.display =
    "block";

  fileName.style.display =
    "block";

  videoInfo.style.display =
    "grid";

  processBtn.disabled =
    false;

  fileName.textContent =
    file.name;

  size.textContent =
    formatBytes(file.size);

  resolution.textContent =
    "Đang đọc...";

  aspect.textContent =
    "Đang đọc...";

  duration.textContent =
    "Đang đọc...";


  videoPreview.onloadedmetadata =
    function(){

      const width =
        videoPreview.videoWidth;

      const height =
        videoPreview.videoHeight;

      resolution.textContent =
        width + " × " + height;

      aspect.textContent =
        detectAspect(
          width,
          height
        );

      duration.textContent =
        formatDuration(
          videoPreview.duration
        );

    };

}


/* ==========================
   KIỂM TRA VIDEO
========================== */

function isVideo(file){

  if(
    file.type &&
    file.type.startsWith("video/")
  ){
    return true;
  }

  return /\.(mp4|mov|mkv|webm|avi|m4v)$/i
    .test(file.name);

}


/* ==========================
   KHUNG HÌNH
========================== */

function detectAspect(width,height){

  if(!width || !height){
    return "—";
  }

  const gcd =
    getGCD(width,height);

  const w =
    Math.round(width / gcd);

  const h =
    Math.round(height / gcd);

  return w + ":" + h;

}


function getGCD(a,b){

  while(b !== 0){

    const temp = b;

    b = a % b;

    a = temp;

  }

  return a;

}


/* ==========================
   DUNG LƯỢNG
========================== */

function formatBytes(bytes){

  if(bytes === 0){
    return "0 B";
  }

  const units =
    ["B","KB","MB","GB"];

  const i =
    Math.floor(
      Math.log(bytes) /
      Math.log(1024)
    );

  return (
    (bytes /
      Math.pow(1024,i))
      .toFixed(2)
    + " "
    + units[i]
  );

}


/* ==========================
   THỜI LƯỢNG
========================== */

function formatDuration(seconds){

  if(!Number.isFinite(seconds)){
    return "—";
  }

  seconds =
    Math.floor(seconds);

  const h =
    Math.floor(seconds / 3600);

  const m =
    Math.floor(
      (seconds % 3600) / 60
    );

  const s =
    seconds % 60;

  if(h > 0){

    return (
      String(h).padStart(2,"0")
      + ":"
      + String(m).padStart(2,"0")
      + ":"
      + String(s).padStart(2,"0")
    );

  }

  return (
    String(m).padStart(2,"0")
    + ":"
    + String(s).padStart(2,"0")
  );

}


/* ==========================
   API KEY
========================== */

apiKey.value =
  localStorage.getItem(
    "FFVN_TGM_API_KEY"
  ) || "";

apiKey.addEventListener(
  "input",
  function(){

    localStorage.setItem(
      "FFVN_TGM_API_KEY",
      this.value.trim()
    );

  }
);


/* ==========================
   DRAG DROP
========================== */

selectBox.addEventListener(
  "dragover",
  function(e){

    e.preventDefault();

    selectBox.classList.add("drag");

  }
);

selectBox.addEventListener(
  "dragleave",
  function(){

    selectBox.classList.remove("drag");

  }
);

selectBox.addEventListener(
  "drop",
  function(e){

    e.preventDefault();

    selectBox.classList.remove("drag");

    const file =
      e.dataTransfer.files[0];

    if(file){
      loadVideo(file);
    }

  }
);


/* ==========================
   XỬ LÝ 4K
========================== */

processBtn.addEventListener(
  "click",
  async function(){

    if(!selectedFile){

      alert("Bạn chưa chọn video.");

      return;

    }

    const key =
      apiKey.value.trim();

    if(!key){

      alert("Vui lòng nhập API Key.");

      apiKey.focus();

      return;

    }

    processBtn.disabled =
      true;

    progressBox.style.display =
      "block";

    result.style.display =
      "none";

    setProgress(
      0,
      "Đang tải video..."
    );

    status.textContent =
      "Đang gửi video lên máy chủ...";


    try{

      const formData =
        new FormData();

      formData.append(
        "video",
        selectedFile
      );


      const response =
        await fetch(
          "/api/enhance",
          {
            method:"POST",

            headers:{
              "x-api-key":key
            },

            body:formData
          }
        );


      const data =
        await response.json();


      if(!response.ok){

        throw new Error(
          data.error ||
          "API xử lý thất bại."
        );

      }


      jobId =
        data.id;

      setProgress(
        5,
        "Đã tải video"
      );

      status.textContent =
        "FFmpeg đang xử lý video...";

      startPolling();

    }
    catch(error){

      setProgress(
        0,
        "Thất bại"
      );

      status.textContent =
        "Lỗi: " + error.message;

      processBtn.disabled =
        false;

    }

  }
);


/* ==========================
   THEO DÕI TIẾN ĐỘ
========================== */

function startPolling(){

  clearInterval(polling);

  polling =
    setInterval(
      async function(){

        try{

          const key =
            apiKey.value.trim();

          const response =
            await fetch(
              "/api/status/" + jobId,
              {
                headers:{
                  "x-api-key":key
                }
              }
            );


          const data =
            await response.json();


          if(!response.ok){

            throw new Error(
              data.error ||
              "Không lấy được trạng thái."
            );

          }


          const percent =
            Number(
              data.progress || 0
            );


          setProgress(
            percent,
            data.status === "completed"
              ? "Hoàn tất"
              : "Đang xử lý"
          );


          if(data.message){

            status.textContent =
              data.message;

          }


          if(
            data.status ===
            "completed"
          ){

            clearInterval(
              polling
            );


            downloadBtn.href =
              "/api/download/"
              + jobId
              + "?key="
              + encodeURIComponent(key);


            result.style.display =
              "block";

            setProgress(
              100,
              "Hoàn tất"
            );

            status.textContent =
              "Video 4K đã xử lý xong.";

            processBtn.disabled =
              false;

          }


          if(
            data.status === "error"
          ){

            throw new Error(
              data.error ||
              "Xử lý video thất bại."
            );

          }

        }
        catch(error){

          clearInterval(
            polling
          );

          setProgress(
            0,
            "Thất bại"
          );

          status.textContent =
            "Lỗi: " + error.message;

          processBtn.disabled =
            false;

        }

      },
      1500
    );

}


/* ==========================
   PROGRESS
========================== */

function setProgress(
  percent,
  text
){

  percent =
    Math.max(
      0,
      Math.min(
        100,
        Number(percent)
      )
    );

  progressBar.style.width =
    percent + "%";

  progressPercent.textContent =
    Math.round(percent) + "%";

  progressText.textContent =
    text;

}


/* ==========================
   CLEANUP
========================== */

window.addEventListener(
  "beforeunload",
  function(){

    if(previewURL){

      URL.revokeObjectURL(
        previewURL
      );

    }

  }
);

</script>

</body>
</html>
